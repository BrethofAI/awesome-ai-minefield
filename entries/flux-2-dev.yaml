tagline: 'FLUX [dev] Non-Commercial License (v2.0 text in BFL''s flux2 repo; the gated Hugging Face card is tagged flux-non-commercial-license). The weights are non-commercial: "You may only access, use, Distribute, or create Derivatives of the FLUX [dev] Model or Derivatives for Non-Commercial Purposes." Outputs are a different story: "You may use Output for any purpose (including for commercial purposes), except as expressly prohibited herein. You may not use the Output to train, fine-tune, or distill a model that is competitive with a FLUX [dev] Model." (https://github.com/black-forest-labs/flux2/blob/main/model_licenses/LICENSE-FLUX-DEV). But "Non-Commercial Purpose" only covers use where you "do not receive any direct or indirect payment" — running it inside a paid product or for paying clients needs a BFL commercial licence. 32B flagship of the FLUX.2 family; klein 4B is the Apache 2.0 sibling.'
tags:
