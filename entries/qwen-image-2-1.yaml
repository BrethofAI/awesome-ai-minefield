tagline: 'Qwen RESEARCH LICENSE AGREEMENT (release date 2026-09-20) — NOT Apache 2.0, unlike Qwen-Image and Qwen-Image-Edit. It covers every open 2.1 checkpoint: Qwen-Image-2.1 (released 2026-09-20), Qwen-Image-2.1-Turbo (8-step generation and editing, released 2026-10-09) and the PE-T2I / PE-I2I prompt-enhancer models. All four Hugging Face cards are tagged license_name: qwen-research and ship the same LICENSE as the GitHub repo (https://github.com/QwenLM/Qwen-Image-2.1/blob/main/LICENSE). Section 2a grants the right "to use, reproduce, distribute, copy, create derivative works of, and make modifications to the Materials FOR NON-COMMERCIAL PURPOSES ONLY", where "Non-Commercial" means "for research or evaluation purposes only"; 2b: "You shall not use the Materials for any commercial purpose without obtaining a separate commercial license from us." So no 2.1 weights, Turbo included, are commercially usable as released. Models trained on its outputs and distributed must show "Built with Qwen" or "Improved using Qwen"; the licence has no clause allowing commercial use of outputs. The README also announces hosted Qwen-Image-2.1 Pro and Turbo APIs on Alibaba Cloud Model Studio (2026-10-09); those are a separate service whose terms this card does not cover. For commercial self-hosted image work stay on the Apache-2.0 Qwen-Image line.'
