tagline: 'Qwen Community License 1.0 (released 2026-08-24) — MIT-style grant with two conditions. First, a service-type exclusion: "If the licensee or any of its affiliates conducts a Model as a Service or AI Work Assistant business, the licensee shall obtain a separate license from Qwen before Using the Software or its derivative works for any commercial purpose." "AI Work Assistant" means a product "primarily designed for AI-assisted coding or office productivity" — so a paid coding assistant or inference API needs a deal; internal use is exempt. Second, attribution at scale: above 100M MAU or US$20M monthly revenue, the model name "must be prominently displayed on the user interface". Otherwise commercial use, fine-tuning and redistribution are allowed.'
