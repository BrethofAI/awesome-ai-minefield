tagline: 'LTX-2 Community License Agreement (dated 2026-01-05; covers LTX-2 through LTX-2.3). Free unless you are big: "Entities with annual revenues of at least $10,000,000 (the "Commercial Entities") are required to obtain a paid commercial use license", counted across affiliates. Unlicensed commercial use by such an entity triggers liquidated damages "equal to double the amount that would otherwise have been paid". Use restrictions apply to everyone, including outputs: no content placed in context "without expressly and intelligibly disclaiming that the information and/or content is machine generated", no deepfakes without consent, and no use in a product that "directly competes with Licensor''s commercial products". The licence has no explicit output-ownership clause. Newer releases (LTX-2.5 onward, from 2026-08-11) use a separate LTX-2.x Community License (https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2_x): same $10M threshold, but the 2× damages become fees owed within 30 days of demand, big entities get a non-commercial carve-out, and you must not remove watermarking, provenance or "latent disclosure" features, with explicit EU AI Act compliance.'
