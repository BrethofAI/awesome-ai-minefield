tagline: 'Apache 2.0 — a break from the custom Gemma Terms of Use that covered Gemma 3. Google''s Gemma 4 licence link (ai.google.dev/gemma/docs/gemma_4_license) now redirects to the plain Apache License 2.0, and every Gemma 4 card is tagged license: apache-2.0: a "perpetual, worldwide, non-exclusive, no-charge, royalty-free, irrevocable copyright license". No revenue cap, no MAU trigger, no attribution beyond the notice. Sizes from E2B / E4B (on-device) through 12B, 26B-A4B (MoE) and 31B, multimodal input, up to 256K context — small enough to self-host on one GPU.'
